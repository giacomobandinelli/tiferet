ecb:
  api_url: https://data-api.ecb.europa.eu/service/data
  datasets:
    - flow: YC
      publication:
        value: {target_days_after: 1, time: "12:00"}
        unit: target_business_days_after_observation_and_berlin_time
        source_url: https://www.ecb.europa.eu/stats/financial_markets_and_interest_rates/euro_area_yield_curves/html/index.en.html
        checked_on: 2026-10-27
        verified: true
        note: >-
          The curves are updated every TARGET business day at noon (12:00 CET). The page does
          not say whether a release holds that day's or the previous day's market, so the
          next TARGET business day is used.
      series:
        - {series_id: ecb_yc_aaa_3m, key: B.U2.EUR.4F.G_N_A.SV_C_YM.SR_3M, units: percent}
        - {series_id: ecb_yc_aaa_2y, key: B.U2.EUR.4F.G_N_A.SV_C_YM.SR_2Y, units: percent}
        - {series_id: ecb_yc_aaa_10y, key: B.U2.EUR.4F.G_N_A.SV_C_YM.SR_10Y, units: percent}
        - {series_id: ecb_yc_all_3m, key: B.U2.EUR.4F.G_N_C.SV_C_YM.SR_3M, units: percent}
        - {series_id: ecb_yc_all_2y, key: B.U2.EUR.4F.G_N_C.SV_C_YM.SR_2Y, units: percent}
        - {series_id: ecb_yc_all_10y, key: B.U2.EUR.4F.G_N_C.SV_C_YM.SR_10Y, units: percent}
    - flow: EST
      publication:
        value: {target_days_after: 1, time: "09:00"}
        unit: target_business_days_after_observation_and_berlin_time
        source_url: https://www.ecb.europa.eu/stats/financial_markets_and_interest_rates/euro_short-term_rate/html/eurostr_overview.en.html
        checked_on: 2026-10-27
        verified: true
        note: >-
          The €STR for a TARGET business day is published at 08:00 CET on the next one and
          may be revised once at 09:00 CET that day; 09:00 is used.
      series:
        - {series_id: ecb_estr, key: B.EU000A2X2A25.WT, units: percent}
    - flow: EXR
      publication:
        value: {target_days_after: 0, time: "17:00"}
        unit: target_business_days_after_observation_and_berlin_time
        source_url: https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/index.en.html
        checked_on: 2026-10-27
        verified: true
        note: >-
          The reference rates are usually updated at around 16:00 CET every working day;
          one hour of margin is added.
      series:
        - {series_id: ecb_exr_usd, key: D.USD.EUR.SP00.A, units: usd_per_eur}
        - {series_id: ecb_exr_gbp, key: D.GBP.EUR.SP00.A, units: gbp_per_eur}
        - {series_id: ecb_exr_chf, key: D.CHF.EUR.SP00.A, units: chf_per_eur}
        - {series_id: ecb_exr_jpy, key: D.JPY.EUR.SP00.A, units: jpy_per_eur}
