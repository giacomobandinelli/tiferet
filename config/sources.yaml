      columns: [Mkt-RF, SMB, HML, RF]
      market_return: true
    - file: Developed_3_Factors_Daily_CSV.zip
      dataset: dev3
      frequency: daily
      columns: [Mkt-RF, SMB, HML, RF]
      market_return: true
    - file: Europe_3_Factors_CSV.zip
