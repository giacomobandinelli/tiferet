shiller:
  attribution: Robert J. Shiller, shillerdata.com
  page_url: https://shillerdata.com/
  link_name: ie_data.xls
  sheet: Data
  date_header: Date
  price_lag_days:
    value: 0
    unit: days_after_period_end
    source_url: https://shillerdata.com/
    checked_on: 2026-10-27
    verified: true
    note: >-
      The page states that stock prices are monthly averages of daily closing prices, so a
      month's price is complete at the end of that month.
  earnings_dividends_lag_days:
    value: 183
    unit: days_after_quarter_end
    source_url: https://www.sec.gov/about/forms/form10-k.pdf
    checked_on: 2026-10-27
    verified: true
    note: >-
      Monthly dividends and earnings are interpolated from S&P four-quarter totals
      (shillerdata.com), so a month depends on its quarter's total; years before
      annual_before follow the annual rule (decision 0013). Annual reports are due
      60, 75 or 90 days after the fiscal year end (Form 10-K, General Instruction A); 183
      days adds about one further quarter for compilation and for the interpolation.
  series:
    - series_id: shiller_sp_price
      header: P
      units: index_points
      rule: month_end
    - series_id: shiller_sp_dividend
      header: D
      units: index_points_per_year
      rule: quarter_end
      annual_before:
        value: 1926
        unit: year
        source_url: https://shillerdata.com/
        checked_on: 2026-10-27
        verified: true
        note: >-
          Monthly figures are computed from S&P four-quarter totals since 1926; earlier
          figures are interpolated from annual Cowles data.
    - series_id: shiller_sp_earnings
      header: E
      units: index_points_per_year
      rule: quarter_end
      annual_before:
        value: 1926
        unit: year
        source_url: https://shillerdata.com/
        checked_on: 2026-10-27
        verified: true
        note: >-
          Monthly figures are computed from S&P four-quarter totals since 1926; earlier
          figures are interpolated from annual Cowles data.
    - series_id: shiller_cpi
      header: CPI
      units: index_1982_1984_100
      rule: follows
      follows: fred_cpiaucsl
      annual_before:
        value: 1913
        unit: year
        source_url: https://shillerdata.com/
        checked_on: 2026-10-27
        verified: false
        reason: >-
          The page states that the CPI-U begins in 1913 and that earlier years splice in the
          Warren and Pearson price index, without giving that index's frequency. It is
          treated as annual, which can only delay known_at.
    - series_id: shiller_long_rate
      header: Rate GS10
      units: percent
      rule: follows
      follows: fred_dgs10
      annual_before:
        value: 1953
        unit: year
        source_url: https://shillerdata.com/
        checked_on: 2026-10-27
        verified: false
        reason: >-
          The page does not name the long-rate source. The monthly 10-year Treasury yield
          starts in April 1953; earlier values are treated as interpolated from annual
          yields, which can only delay known_at.

