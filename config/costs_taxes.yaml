# Cost and tax parameters (docs/plan.md sections 3.8 and 3.9, decisions 0004 and 0006).
#
# Every fee, including each holding's TER, and every tax parameter lives here, keyed where
# relevant by the instrument key in config/holdings.yaml. No cost or tax constant is written
# into code.
#
# Every parameter is a sourced value:
#   value        the parameter
#   unit         unit of value
#   source_url   where it was checked
#   checked_on   date of the check
#   verified     true if the value was read on a primary source on checked_on
#   reason       required when verified is false
#   note         optional context
#
# Units: "fraction" is a plain ratio (0.0007 = 0.07%); "fraction_per_year" is a ratio per
# year; "fraction_of_trade_value" is a ratio of the traded amount; "eur" and "usd" are
# currency amounts; "btc" and "eth" are native coin amounts.

