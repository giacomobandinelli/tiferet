        checked_on: 2026-10-25
        verified: true
        note: BMF letter of 9 January 2019, IV C 1 - S 1980-1/14/10001 :038, BStBl 2019 I S. 58; rate as of 2 January 2019.
      2020:
        value: 0.0007
        unit: fraction
        source_url: https://www.bvl-verband.de/fileadmin/steuerpolitik/bmf-schreiben/2020/2020-01-29-basiszins-zur-berechnung-der-vorabpauschale.pdf_jsessionid_5FDAC63EDFF38A2A3FE928CB0B85B730.delivery1-replication.pdf
        checked_on: 2026-10-25
        verified: true
        note: BMF letter of 29 January 2020, IV C 1 - S 1980-1/19/10038 :001, BStBl 2020 I S. 218; rate as of 2 January 2020.
