          https://www.bundesfinanzministerium.de/Content/DE/Downloads/BMF_Schreiben/Steuerarten/Investmentsteuer/2026-01-13-basiszins-berechnung-vorabpauschale.pdf
  savers_allowance:
    value: 1000
    unit: eur
    source_url: https://www.gesetze-im-internet.de/estg/__20.html
    checked_on: 2026-10-25
    verified: true
    note: Section 20(9) sentence 1 EStG (Sparer-Pauschbetrag, single assessment).
  loss_pots:
    capital_income:
      value: {offsets_only: capital_income, carry_back_years: 0, carry_forward_years: null}
      unit: rule
      source_url: https://www.gesetze-im-internet.de/estg/__20.html
      checked_on: 2026-10-25
      verified: true
      note: >-
        Section 20(6) sentences 1 and 2 EStG: losses from capital income may not offset other
        income types and reduce capital income of later years without limit (null = no limit);
        no carry-back. Fund units are not shares, so the separate share-loss pot of sentence 4
        does not apply to the holdings.
    private_sales:
      value: {offsets_only: private_sales, carry_back_years: 1, carry_forward_years: null}
      unit: rule
      source_url: https://www.gesetze-im-internet.de/estg/__23.html
      checked_on: 2026-10-25
      verified: true
      note: >-
        Section 23(3) sentences 7 and 8 EStG: losses from private sales offset only gains from
        private sales of the same year, then those of the immediately preceding year or of
        later years under section 10d (null = no limit). Applies to crypto and Xetra-Gold.
  sec23_exemption_threshold:
    value: 1000
    unit: eur
    source_url: https://www.gesetze-im-internet.de/estg/__23.html
    checked_on: 2026-10-25
    verified: true
    note: >-
      Section 23(3) sentence 5 EStG: gains stay tax-free if total private-sale gains in the
      calendar year are less than 1,000 euros; otherwise they are taxable in full (Freigrenze).
  sec23_holding_period:
    value: 12
    unit: months
    source_url: https://www.gesetze-im-internet.de/estg/__23.html
    checked_on: 2026-10-25
    verified: true
    note: >-
      Section 23(1) sentence 1 no. 2 EStG: a sale is taxable if no more than one year passes
      between purchase and sale. The ten-year period of sentence 4 (assets used to earn
      income, such as staked coins) does not apply because the holdings are not staked or lent.
  sec23_applies_to:
    value: [crypto, physical_gold_etc]
    unit: tax_classes
    source_url: https://www.xetra-gold.com/in-gold-investieren/faqs/
    checked_on: 2026-10-25
    verified: true
    note: >-
      Directly held crypto falls under section 23(1) sentence 1 no. 2 EStG. Xetra-Gold is taxed
      like physical gold (BFH VIII R 4/15 and VIII R 35/14 of 12 May 2015, as cited by the issuer).
  personal_income_tax_rate:
    value: 0.42
    unit: fraction
    source_url: https://www.gesetze-im-internet.de/estg/__32a.html
    checked_on: 2026-10-25
    verified: true
    note: >-
      Marginal rate of the section 32a(1) EStG tariff from 2026 for taxable income of 69,879 to
      277,825 euros. Applied without solidarity surcharge to taxable short-term private sales
      (decision 0006).
