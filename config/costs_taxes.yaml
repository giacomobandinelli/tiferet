  vorabpauschale:
    basisertrag_factor:
      value: 0.70
      unit: fraction
      source_url: https://www.gesetze-im-internet.de/invstg_2018/__18.html
      checked_on: 2026-10-25
      verified: true
      note: >-
        Section 18(1) InvStG: Basisertrag = redemption price at the start of the year x 70% of
        the Basiszins, capped at the year's price increase plus distributions; the
        Vorabpauschale is the amount by which distributions fall short of the Basisertrag.
    purchase_year_reduction_denominator:
      value: 12
      unit: months
      source_url: https://www.gesetze-im-internet.de/invstg_2018/__18.html
      checked_on: 2026-10-25
      verified: true
      note: >-
        Section 18(2) InvStG: in the year of purchase the Vorabpauschale is reduced by one
        twelfth (1 / value) for each full month before the month of purchase.
    deemed_received:
      value: first working day of the following calendar year
      unit: rule
      source_url: https://www.gesetze-im-internet.de/invstg_2018/__18.html
      checked_on: 2026-10-25
      verified: true
      note: Section 18(3) InvStG.
    credited_against_sale_gain:
      value: in full, regardless of any partial exemption
      unit: rule
      source_url: https://www.gesetze-im-internet.de/invstg_2018/__19.html
      checked_on: 2026-10-25
      verified: true
      note: Section 19(1) sentences 3 and 4 InvStG.
    basiszins_note: >-
      Basiszins values below are those published by the Bundesministerium der Finanzen for
      each year from 2018, when the Vorabpauschale was introduced. Earlier years, needed
      because current law is applied to the full history (decision 0006), are derived in the
      tax-engine task with the legal method (section 18(4) InvStG with section 203(2) BewG,
      from Bundesbank yield data) and verified there. The current text of section 203(2) BewG
      on gesetze-im-internet.de, checked 2026-10-25, contains only the authorisation to adjust
      the capitalisation factor; the reference is to be confirmed in that task. The BMF
      website blocks automated access, so each letter was read in a copy of its text at
      source_url; the letter is identified in note.
    basiszins:
      2018:
        value: 0.0087
        unit: fraction
        source_url: https://datenbank.nwb.de/Dokument/720807/
        checked_on: 2026-10-25
        verified: true
