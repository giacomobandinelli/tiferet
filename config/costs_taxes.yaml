      2026:
        value: 0.0320
        unit: fraction
        source_url: https://direkt.bvi.de/fileadmin/user_upload/letter/2026/COO.7005.100.4.13897455.pdf
        checked_on: 2026-10-25
        verified: true
        note: >-
